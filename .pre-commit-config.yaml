repos:
  - repo: local
    hooks:
      - id: jobhub-secret-scan
        name: secrets and RED-path guard
        entry: python scripts/scan_secrets.py
        language: system
        types: [text]
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ["--baseline", ".secrets.baseline"]
        exclude: ^tests/test_secret_scan\.py$
